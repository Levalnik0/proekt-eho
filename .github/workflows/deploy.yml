# Собирает приложение и публикует его на GitHub Pages
# при каждом пуше в ветку main.
name: Publish

on:
  push:
    branches: [main]
  # Позволяет запустить публикацию вручную из вкладки Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Если пушей несколько подряд — публикуем только последний
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # Сайт живёт по адресу вида user.github.io/имя-репозитория/,
      # поэтому все пути внутри сборки должны начинаться с этого префикса
      - run: npm run build -- --base=/${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
